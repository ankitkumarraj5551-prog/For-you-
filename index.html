<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PLSS KAJU BBY JI 🥺❤️</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at center, #1a0826 0%, #080310 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow: hidden;
    }

    .card {
      background: rgba(25, 12, 38, 0.95);
      border: 2px solid #ff2a85;
      box-shadow: 0 0 25px rgba(255, 42, 133, 0.35);
      border-radius: 20px;
      padding: 24px 18px;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #00f2fe;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #ff2a85;
      margin-bottom: 12px;
      line-height: 1.4;
      text-shadow: 0 0 10px rgba(255, 42, 133, 0.4);
    }

    p.desc {
      font-size: 13.5px;
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 16px;
    }

    .line {
      height: 4px;
      background: linear-gradient(90deg, #00f2fe, #ff2a85);
      border-radius: 2px;
      margin-bottom: 22px;
    }

    /* Fixed Box for Buttons */
    .button-box {
      position: relative;
      width: 100%;
      height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .btn-yes {
      background: #ff2a85;
      color: #ffffff;
      border: none;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(255, 42, 133, 0.5);
      cursor: pointer;
      width: 90%;
      max-width: 280px;
      transition: transform 0.15s ease, background 0.2s ease;
      z-index: 2;
    }

    .btn-no {
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.12s ease;
      position: relative;
    }

    /* Success Card */
    #celebrateCard {
      display: none;
      text-align: center;
      animation: pop 0.3s ease forwards;
    }

    @keyframes pop {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <div id="contentArea">
      <span class="badge">SYS::APOLOGY_LOCK 🚨</span>
      <h1>PLSS KAJU BBY JI<br>MAAN JAO NA 🥺❤️</h1>
      <p class="desc">
        Mera dimag sach me kharab ho gaya tha... I am really very sorry! Gussa bilkul band kar do na plss! 😭
      </p>
      <div class="line"></div>

      <div class="button-box" id="box">
        <button class="btn-yes" id="yesBtn" onclick="acceptForgiveness()">MAAN GAYI BBY ❤️</button>
        <button class="btn-no" id="noBtn" onclick="dodgeNo()" onmouseover="dodgeNo()">NAHI MAANUNGI 😤</button>
      </div>
    </div>

    <div id="celebrateCard">
      <div style="font-size: 60px; margin-bottom: 10px;">🥰🥹🎉</div>
      <h1 style="margin-bottom: 8px;">YAYYY MAAN GAYI! ❤️</h1>
      <p class="desc" style="color: #00f2fe;">
        Thank you kaju bby ji! 🥰<br>
        Ab gussa bilkul khatam.<br>
        Promise ab tang nahi karunga! ✨
      </p>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    let count = 0;

    const phrases = [
      "Arey suno na! 🥺",
      "Kaju plss maan jao! 😭",
      "Pakad ke dikhao! 🏃",
      "Itna gussa?! 💔"
    ];

    function dodgeNo() {
      count++;

      // Small jitter inside the safe box
      const shiftX = (Math.random() - 0.5) * 140;
      const shiftY = (Math.random() - 0.5) * 40;
      noBtn.style.transform = `translate(${shiftX}px, ${shiftY}px)`;

      if (count <= phrases.length) {
        noBtn.innerText = phrases[count - 1];
      }

      // Automatically removes NO and highlights YES
      if (count >= 4) {
        noBtn.style.display = "none";
        yesBtn.innerText = "BAS YEH DABAO! 💖";
        yesBtn.style.transform = "scale(1.08)";
        yesBtn.style.background = "#00f2fe";
        yesBtn.style.color = "#000";
        yesBtn.style.boxShadow = "0 0 20px rgba(0, 242, 254, 0.7)";
      }
    }

    function acceptForgiveness() {
      document.getElementById("contentArea").style.display = "none";
      document.getElementById("celebrateCard").style.display = "block";

      confetti({
        particleCount: 80,
        spread: 80,
        origin: { y: 0.6 }
      });
    }
  </script>
</body>
</html>
